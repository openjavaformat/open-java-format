import java.util.regex.Matcher
import java.util.regex.Pattern
import java.util.Optional
import org.graalvm.buildtools.gradle.tasks.BuildNativeImageTask

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.graalvm.buildtools:native-gradle-plugin:1.1.12'
        classpath 'com.palantir.gradle.utils:platform:0.29.0'
    }
}


apply plugin: 'java-library'
apply plugin: 'org.graalvm.buildtools.native'

dependencies {
    implementation project(':palantir-java-format')
}

import com.palantir.platform.OperatingSystem
import com.palantir.platform.Architecture

def operatingSystem = OperatingSystem.get()
def architecture = Architecture.get()

def exports = [
        'jdk.compiler/com.sun.tools.javac.file',
        'jdk.compiler/com.sun.tools.javac.main',
        'jdk.compiler/com.sun.tools.javac.parser',
        'jdk.compiler/com.sun.tools.javac.tree',
        'jdk.compiler/com.sun.tools.javac.util',
        'jdk.compiler/com.sun.tools.javac.code',
        'jdk.compiler/com.sun.tools.javac.api'
]

def jvmArgList = exports.collect { value -> "--add-exports=${value}=ALL-UNNAMED".toString() }

graalvmNative {
    // 1.x turns the shared GraalVM reachability-metadata repository on by default; 0.10.x had
    // no such thing, and it refuses to run unless the JDK is newer than the one Gradle resolves
    // here. This project ships its own metadata (configurationFileDirectories below), so keep
    // the previous behaviour rather than couple the build to a GraalVM patch level.
    metadataRepository {
        enabled = false
    }

    // native-gradle-plugin 1.x exposes these as lazy Property/FileCollection. Groovy's `=`
    // shorthand does not reach them through the container's proxy, so set them explicitly.
    binaries.named('main') {
        it.javaLauncher.set(javaToolchains.launcherFor {
            it.languageVersion.set(JavaLanguageVersion.of(25))
            it.vendor.set(JvmVendorSpec.GRAAL_VM)
        })
        it.imageName.set(String.format('palantir-java-format-%s_%s', operatingSystem.uiName(), architecture.uiName()))
        it.mainClass.set('com.palantir.javaformat.java.Main')
        it.fallback.set(false)
        it.sharedLibrary.set(false)
        it.classpath.from(configurations.named('runtimeClasspath'))
        it.configurationFileDirectories.from(file('src/main/resources/META-INF/native-image'))
        it.buildArgs.addAll(
                '-H:+UnlockExperimentalVMOptions',
                '-H:+IncludeAllLocales',
                '--no-fallback',
                // Missing reachability metadata must fail loudly instead of looking like an
                // absent class: without this an unregistered Class.forName throws
                // ClassNotFoundException, and any optional-dependency fallback swallows it.
                // GraalVM 23+ only — affordable because the image is the one artifact that
                // owes nobody backwards compatibility.
                '--exact-reachability-metadata',
                '--initialize-at-build-time=com.sun.tools.javac.file.Locations',
                '-H:+ReportExceptionStackTraces',
                '-H:-UseContainerSupport',
                "-march=compatibility")
        it.jvmArgs.addAll(jvmArgList)
    }
}

// One publication either way: external-publish's CI-only variant is gone, and JReleaser
// stages whatever maven-publish produces.
publishing {
    publications {
        nativeImage(MavenPublication) {
            artifact(tasks.named('nativeCompile', BuildNativeImageTask.class).map { it.getOutputFile() }) {
                classifier = String.format("nativeImage-%s", getOsArchName(it.getFile()))
                extension = getExtension(it.getFile())
            }
        }
    }
}

private static String getExtension(File file) {
    Pattern pattern = Pattern.compile("palantir-java-format-(.*)_(.*)\$");
    Matcher matcher = pattern.matcher(file.name)
    if (matcher.find()) {
        return OperatingSystem.fromStringThrowing(matcher.group(1))
                == OperatingSystem.WINDOWS ? "exe" : "bin"
    }
    throw new GradleException("Could not determine OS name from file name: ${file.name}")
}

private static String getOsArchName(File file) {
    Pattern pattern = Pattern.compile("palantir-java-format-(.*)_(.*)\$");
    Matcher matcher = pattern.matcher(file.name)
    if (matcher.find()) {
        return matcher.group(1) + "_" + matcher.group(2)
    }
    throw new GradleException("Could not determine OS name from file name: ${file.name}")
}

configurations {
    nativeImage {
        canBeConsumed = true
        canBeResolved = false
        // Publishing the binary here is precisely what makes `assemble` (and therefore
        // `build`) depend on `nativeCompile`, so it is opt-in. See rootProject.build.gradle.
        if (rootProject.ext.nativeImageRequested) {
            outgoing.artifact(tasks.named('nativeCompile').map(task -> task.getOutputFile()))
        }
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, project.objects.named(LibraryElements, 'nativeImage'))
        }
    }
}
