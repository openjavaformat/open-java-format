<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none"
     role="img" aria-labelledby="t">
  <title id="t">open-java-format</title>
  <!-- Column guide: its rhythm deliberately does not match the code lines, so it reads as a
       layer behind them rather than decoration on them. -->
  <g fill="currentColor" opacity="0.55">
    <rect x="20.6" y="3.2" width="1.4" height="3.8" rx="0.7"/>
    <rect x="20.6" y="9.9" width="1.4" height="3.8" rx="0.7"/>
    <rect x="20.6" y="16.6" width="1.4" height="3.8" rx="0.7"/>
  </g>
  <!-- A broken method chain. The first and third bars end on the same x: that shared right edge
       is the boundary, and it survives every size because nothing thin draws it. -->
  <g fill="currentColor">
    <rect x="2" y="3.8" width="17.4" height="2.8" rx="1.4"/>
    <rect x="7.8" y="9.2" width="8.6" height="2.8" rx="1.4"/>
    <rect x="7.8" y="13.6" width="11.6" height="2.8" rx="1.4"/>
    <rect x="7.8" y="18" width="4.4" height="2.8" rx="1.4"/>
  </g>
</svg>
