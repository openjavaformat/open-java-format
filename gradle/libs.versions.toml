# Dependency versions for the whole build. Replaces palantir/gradle-consistent-versions
# (versions.props + versions.lock): a version catalog is plain Gradle, and Dependabot
# updates it, which it could not do for versions.props.

[libraries]
# Eclipse bundles the plugin compiles against. compileOnly: at runtime the host IDE
# provides them, and META-INF/MANIFEST.MF imports the packages without version ranges.
# Versions here match Eclipse 2020-09, which is what the p2 repository used to resolve.
eclipse-jdtCore = { module = "org.eclipse.jdt:org.eclipse.jdt.core", version = "3.23.0" }
eclipse-jfaceText = { module = "org.eclipse.platform:org.eclipse.jface.text", version = "3.16.300" }
eclipse-text = { module = "org.eclipse.platform:org.eclipse.text", version = "3.10.200" }
jetbrainsAnnotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
# A platform, not a dependency: plugins (baseline) inject versionless JUnit artifacts such as
# junit-platform-launcher, and versions.props used to supply their versions.
junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }
autoService = { module = "com.google.auto.service:auto-service", version = "1.1.1" }
baseline-gradlePlugin = { module = "com.palantir.baseline:gradle-baseline-java", version = "7.9.0" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version = "3.2.4" }
compileTesting = { module = "com.google.testing.compile:compile-testing", version = "0.23.0" }
derive4j = { module = "org.derive4j:derive4j", version = "1.1.1" }
derive4j-annotation = { module = "org.derive4j:derive4j-annotation", version = "1.1.1" }
functionaljava = { module = "org.functionaljava:functionaljava", version = "5.0" }
guava = { module = "com.google.guava:guava", version = "33.7.1-jre" }
guava-testlib = { module = "com.google.guava:guava-testlib", version = "33.5.0-jre" }
ideaConfiguration-gradlePlugin = { module = "com.palantir.gradle.idea-configuration:gradle-idea-configuration", version = "0.8.0" }
immutables-value = { module = "org.immutables:value", version = "2.12.2" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.22" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version = "2.22.2" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.2" }
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version = "2.22.2" }
jackson-datatype-guava = { module = "com.fasterxml.jackson.datatype:jackson-datatype-guava", version = "2.22.1" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version = "2.22.1" }
jackson-module-parameterNames = { module = "com.fasterxml.jackson.module:jackson-module-parameter-names", version = "2.22.1" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version = "1.37" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version = "1.37" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.3" }
junit-jupiter-migrationsupport = { module = "org.junit.jupiter:junit-jupiter-migrationsupport", version = "6.1.3" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version = "6.1.3" }
palantir-platform = { module = "com.palantir.gradle.utils:platform", version = "0.29.0" }
slsVersions = { module = "com.palantir.sls.versions:sls-versions", version = "1.18.0" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.10.2" }
