org.gradle.parallel=true
org.gradle.caching=true
# Add jvm args to allow spotless and formatter gradle plugins to run with Java 16+
org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Read by the upstream com.palantir.java-format plugin that formats this repository (applied in
# build.gradle), so it keeps the upstream name. The fork's own Gradle plugin reads
# openjavaformat.native.formatter instead.
palantir.native.formatter=true

# Where Gradle looks for JDKs. Auto-detection only reads JAVA_HOME, and CI overwrites that with
# the JDK 21 used for the jars — so without this line GraalVM stays invisible and nativeCompile
# fails with "Cannot find a Java installation ... vendor=GraalVM Community". Locally these are
# unset and mise's installs are found through Gradle's asdf provider instead.
#
# Auto-provisioning stays off deliberately: it cannot produce a working GraalVM anyway, because
# unpacking a downloaded JDK does not preserve the symlink GraalVM ships at bin/native-image.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JDK21_HOME,GRAALVM_HOME

# Configuration cache off for now: parts of this build are not cache-safe yet — the GraalVM plugin
# cannot serialise its NativeConfigurations bean (see README, phase 1) — and chasing a stale entry
# costs more than the cache saves. Turn it on for a single run with --configuration-cache.
#
# A gradle.properties in GRADLE_USER_HOME outranks this file, so anyone who turns the cache on
# globally keeps it on here too.
org.gradle.configuration-cache=false
