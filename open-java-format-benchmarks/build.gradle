apply plugin: 'distribution'
apply plugin: 'me.champeau.jmh'

configurations {
    formatterNativeImage
    formatterNativeJars
}

dependencies {
    jmhAnnotationProcessor libs.jmh.generator.annprocess
    compileOnly libs.jmh.generator.annprocess

    jmhImplementation libs.assertj
    jmhImplementation libs.junit.jupiter
    jmhImplementation libs.jmh.core
    jmhImplementation libs.jmh.generator.annprocess

    formatterNativeJars project(':open-java-format')
    formatterNativeImage(project(':open-java-format-native')) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, project.objects.named(LibraryElements, 'nativeImage'))
        }
    }
}

import me.champeau.jmh.JMHTask

tasks.named('jmh', JMHTask.class) {
    inputs.files(configurations.named('formatterNativeImage'))
    inputs.files(configurations.named('formatterNativeJars'))
    environment.put('NATIVE_IMAGE_CLASSPATH', configurations.named('formatterNativeImage').map { it.asPath })
    environment.put('JARS_CLASSPATH', configurations.named('formatterNativeJars').map { conf -> conf.collect { it.absolutePath }.join(":") })
}

// src/test/resources/PalantirDeeplyNestedCalls.java is a symlink to a formatter test input, which has to
// keep its unformatted shape: leave src/test/resources out of any formatting step added to this build.

jmhCompileGeneratedClasses {
    options.errorprone.enabled = false
}
