// Error Prone with NullAway and Picnic's error-prone-support checks, on the plain net.ltgt plugins.
plugins {
    id 'net.ltgt.errorprone'
    id 'net.ltgt.nullaway'
}

dependencies {
    errorprone libs.errorprone.core
    errorprone libs.nullaway
    errorprone libs.errorProneSupport.contrib
}

nullaway {
    severity = net.ltgt.gradle.errorprone.CheckSeverity.ERROR
    annotatedPackages.add('com.palantir')
    jspecifyMode = true
}

tasks.withType(JavaCompile).configureEach {
    // JSpecify mode reads @Nullable on types from class files, which javac 21 does only with this flag.
    options.compilerArgs.add('-XDaddTypeAnnotationsToSymbol=true')
    options.errorprone {
        // Annotation processor output (Immutables) is not ours to fix.
        excludedPaths = '.*/build/generated/.*'
        nullaway {
            handleTestAssertionLibraries = true
        }
        error('CanonicalAnnotationSyntax')
        error('CollectorMutability')
        error('DefaultCharset')
        error('DirectReturn')
        error('EffectivelyPrivate')
        error('FormatStringConcatenation')
        error('JUnitClassModifiers')
        error('JUnitMethodDeclaration')
        error('RedundantStringConversion')
        error('RefactorSwitch')
        error('SameNameButDifferent')
        error('StringConcatToTextBlock')
        error('UnusedVariable')
        disable('IsInstanceLambdaUsage')
        disable('LexicographicalAnnotationAttributeListing')
        disable('LexicographicalAnnotationListing')
        disable('StringJoining')
    }
}

// Gradle injects services through abstract @Inject getters, which is what this check forbids.
pluginManager.withPlugin('java-gradle-plugin') {
    tasks.withType(JavaCompile).configureEach {
        options.errorprone.disable('JavaxInjectOnAbstractMethod')
    }
}
