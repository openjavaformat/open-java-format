// Applied to the root project: signs the staged publications and uploads them to the Maven Central
// Portal. `mise run release` runs it; `mise run release:dry-run` rehearses without uploading.
plugins {
    id 'base'
    id 'org.jreleaser'
}

// Two deployments, one version. A published groupId:artifactId:version can never gain files, so every
// platform's native binary has to travel in a single deployment — and those binaries come from one CI
// job per platform, long after the jars are staged. `-PreleaseTarget=native` deploys the binaries those jobs
// collected, the default deploys the jars; on a tag both read the same version from it.
//
// `-PreleaseTarget=github` deploys nothing. It is for `jreleaserRelease`, which opens a draft GitHub
// release on the tag with what Maven Central does not carry — the runnable formatter jar, the IntelliJ
// plugin zip, the Eclipse plugin jar and every platform's native binary as a plain download — each file
// signed, plus a checksum file.
//
// gradle-open-java-format is not released here: its plugins go to the Gradle Plugin Portal by hand, with
// `mise run release:gradle-plugin`, once the jars they depend on are published.
def releaseTarget = providers.gradleProperty('releaseTarget').getOrElse('jars')
def releasedProjects
if (releaseTarget == 'jars') {
    releasedProjects = [
            ':open-java-format-spi',
            ':open-java-format',
            ':open-java-format-jdk-bootstrap',
    ]
} else if (releaseTarget == 'native') {
    releasedProjects = [':open-java-format-native']
} else if (releaseTarget == 'github') {
    releasedProjects = []
} else {
    throw new GradleException("Unknown -PreleaseTarget=${releaseTarget}: use 'jars', 'native' or 'github'")
}
def stagingRepositories = releasedProjects.collect { path ->
    relativePath(project(path).layout.buildDirectory.dir('staging-deploy'))
}

// The GitHub release takes the binaries the per-platform jobs collected from -PnativeImages=<dir>, exactly
// as the native deployment does.
def nativeBinaries = []
if (releaseTarget == 'github') {
    def collectedNativeImages = providers.gradleProperty('nativeImages').getOrNull()
    if (collectedNativeImages == null) {
        throw new GradleException('-PreleaseTarget=github needs -PnativeImages=<dir> holding the native binaries')
    }
    nativeBinaries = fileTree(file(collectedNativeImages)) {
        include 'open-java-format-*'
        exclude '**/*.txt'
    }.files.sort { it.name }
    if (nativeBinaries.isEmpty()) {
        throw new GradleException("No native images to release in ${collectedNativeImages}")
    }
}

jreleaser {
    dependsOnAssemble = false

    project {
        name = 'open-java-format'
        description = 'A modern, lambda-friendly, 120-character Java formatter'
        license = 'Apache-2.0'
        links {
            homepage = 'https://github.com/openjavaformat/open-java-format'
        }
        languages {
            java {
                groupId = 'dev.openjavaformat'
                multiProject = true
                version = '21'
            }
        }
    }

    release {
        github {
            enabled = releaseTarget == 'github'
            // The tag is pushed by hand and is the version; the release only attaches to it.
            skipTag = true
            tagName = '{{projectVersion}}'
            releaseName = '{{projectVersion}}'
            // Published by hand after a look, like the deployments waiting in the Portal.
            draft = true
            changelog {
                formatted = 'ALWAYS'
                format = '- {{commitShortHash}} {{commitTitle}}'
            }
        }
    }

    // Name templates, not Gradle's version: the root project sets its version only after applying this
    // plugin. The jars and the zip are built by the tasks jreleaserRelease depends on below.
    files {
        nativeBinaries.each { binary ->
            artifact {
                path = binary.absolutePath
            }
        }
        if (releaseTarget == 'github') {
            artifact {
                path = 'open-java-format/build/libs/open-java-format-{{projectVersion}}-all.jar'
            }
            artifact {
                path = 'open-java-format-idea-plugin/build/distributions/open-java-format-idea-plugin-{{projectVersion}}.zip'
            }
            artifact {
                path = 'open-java-format-eclipse-plugin/build/libs/open-java-format-eclipse-plugin-{{projectVersion}}.jar'
            }
        }
    }

    // The key comes from JRELEASER_GPG_SECRET_KEY and JRELEASER_GPG_PASSPHRASE, in the environment or in
    // ~/.jreleaser/config.properties. There is no public key to check the signatures against, hence
    // verify = false.
    signing {
        pgp {
            active = 'ALWAYS'
            armored = true
            verify = false
        }
    }

    deploy {
        maven {
            mavenCentral {
                // The deployer's name selects its credentials — the Central Portal user token, as
                // JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_SONATYPE_USERNAME and _PASSWORD.
                sonatype {
                    // Nothing is deployed when the target is the GitHub release.
                    active = releaseTarget == 'github' ? 'NEVER' : 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    namespace = 'dev.openjavaformat'
                    applyMavenCentralRules = true
                    // Upload and validate, then stop. The deployment waits in the Portal until someone
                    // presses publish, so a version stays reversible until every one of its deployments
                    // is in and has been looked at.
                    stage = 'UPLOAD'
                    stagingRepositories.each { stagingRepository(it) }
                }
            }
        }
    }
}

tasks.named('jreleaserDeploy') {
    releasedProjects.each { path ->
        dependsOn "${path}:publishAllPublicationsToStagingRepository"
    }
}

tasks.named('jreleaserRelease') {
    if (releaseTarget == 'github') {
        dependsOn ':open-java-format:allJar', ':open-java-format-idea-plugin:buildPlugin',
                ':open-java-format-eclipse-plugin:jar'
    }
}

// A release cannot be taken back, and the version comes from `git describe`: anywhere but a clean
// checkout of a release tag it reads like 2.97.0-41-gf6667a2d.dirty. Refuse to upload that. A release is
// upstream's X.Y.Z, optionally with a build number of our own after it: 2.98.0.1.
def releaseVersion = provider { version.toString() }

['jreleaserDeploy', 'jreleaserRelease'].each { taskName ->
    tasks.named(taskName) {
        doFirst {
            if (!dryrun.getOrElse(false) && !(releaseVersion.get() ==~ /\d+\.\d+\.\d+(\.\d+)?/)) {
                throw new GradleException("Refusing to release ${releaseVersion.get()}: check out a release tag on a "
                        + 'clean working tree, or pass --dryrun to rehearse without uploading.')
            }
        }
    }
}
