plugins {
    id 'groovy-gradle-plugin'
}

// JReleaser's plugin marker and jreleaser-gradle-plugin live on the Gradle Plugin Portal only; everything they
// depend on is on Maven Central, which the Portal merely proxies. That proxy once answered 404 for
// jreleaser-engine and failed a CI build, so Central comes first and is asked directly, as in the root buildscript.
repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'net.ltgt.gradle:gradle-errorprone-plugin:5.1.1'
    implementation 'net.ltgt.gradle:gradle-nullaway-plugin:3.2.0'
    implementation 'org.jreleaser:org.jreleaser.gradle.plugin:1.26.0'
}
