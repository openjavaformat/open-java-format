// IntelliJ Platform Gradle Plugin 2.x. The 1.x plugin — which reached this project through
// com.palantir.external-publish-intellij — cannot run on Gradle 9: it touches
// org.gradle.api.internal.plugins.DefaultArtifactPublicationSet, which no longer exists.
buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.jetbrains.intellij.platform:org.jetbrains.intellij.platform.gradle.plugin:2.18.1'
    }
}

apply plugin: 'java'
apply plugin: 'org.jetbrains.intellij.platform'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

configurations {
    formatter {
        description = 'The default implementation of open-java-format, used if the user doesn\'t specify an explicit classpath.'

        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    intellijPlatform {
        // useInstaller = false: take the IDE from the intellij-repository maven artifact
        // rather than the platform installer, which has no download URL for this version.
        intellijIdeaCommunity('2024.2.6') {
            useInstaller = false
        }
        bundledPlugin 'com.intellij.java'

        // 2.x no longer ships the test framework implicitly. 'closest' is the plugin's own
        // default version constraint; Groovy cannot see Kotlin default arguments, so it is
        // spelled out here.
        testFramework(TestFrameworkType.Platform.INSTANCE, 'closest')
        testFramework(TestFrameworkType.Plugin.Java.INSTANCE, 'closest')
    }

    implementation project(':open-java-format-jdk-bootstrap')
    implementation libs.caffeine
    implementation libs.palantir.platform

    formatter project(':open-java-format')

    testImplementation libs.assertj
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.platform.launcher
    implementation libs.jsr305
}

intellijPlatform {
    // Bytecode instrumentation (@NotNull assertions, GUI forms) needs the platform's
    // java-compiler-ant-tasks, whose version the plugin cannot derive from a non-installer
    // IDE artifact; the 1.x setup only carried instrumentation along with a workaround for the
    // duplicate classes it produced, which the marketplace rejected. Nothing here needs it: the
    // settings page is laid out in plain Java, and the assertions are not relied upon. Do not add a
    // .form back without turning this on — an uninstrumented form leaves every bound field null,
    // which is exactly how the settings page came to be broken.
    instrumentCode = false

    // Launches a headless IDE to index the settings UI for the IDE's search. This plugin has a
    // single settings page, and the task is fragile outside a desktop session — JetBrains
    // recommend switching it off for small plugins.
    buildSearchableOptions = false

    pluginConfiguration {
        name = 'open-java-format'
        // No description here: patchPluginXml would overwrite the one in plugin.xml, which is the
        // marketplace listing and is written in HTML.
        ideaVersion {
            sinceBuild = '242' // JBR 21: the first IDEs that can load this plugin's bytecode
            untilBuild = provider { null }
        }
    }

    // publishPlugin uploads the zip to the JetBrains Marketplace, from the release workflow (see
    // .github/workflows/release.yml). The token is a permanent token of the Marketplace account that owns
    // the plugin; without it the task fails before uploading anything. The Marketplace never takes a version
    // back and rejects a version it already has.
    publishing {
        token = providers.environmentVariable('JETBRAINS_MARKETPLACE_TOKEN')
    }

    // signPlugin runs before publishPlugin and signs the zip with this key, and the Marketplace then adds
    // its own signature on top. Without the three variables signPlugin is skipped and the unsigned zip goes
    // up, which the Marketplace accepts as well. The values are the PEM files themselves; the private key
    // stays encrypted, and the password decrypts it.
    signing {
        certificateChain = providers.environmentVariable('JETBRAINS_CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('JETBRAINS_PRIVATE_KEY')
        password = providers.environmentVariable('JETBRAINS_PRIVATE_KEY_PASSWORD')
    }

    // verifyPlugin checks the plugin's bytecode against real IDEs, which it downloads. Two of them: the
    // IDE the plugin is built against, which is the oldest one sinceBuild admits, and the newest IntelliJ
    // IDEA release. The default, recommended(), would take every major version in between, which is a
    // gigabyte per IDE for nothing the two ends do not show, and it stops at 2025.2: since 2025.3 IntelliJ
    // IDEA is one product (IntellijIdea), no longer split into Community and Ultimate.
    pluginVerification {
        // Fail on what would break an installation: classes or methods the IDE no longer has, a dependency
        // it lacks, an invalid descriptor. Usages of internal, deprecated or experimental API stay warnings
        // in the report: 2026.2 marked every way of looking a plugin descriptor up as @ApiStatus.Internal,
        // PluginManager.findEnabledPlugin included, and a warning about that must not hold a release.
        failureLevel = [
            VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
            VerifyPluginTask.FailureLevel.MISSING_DEPENDENCIES,
            VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
        ]
        ides {
            current()
            latest {
                it.types.set([IntelliJPlatformType.IntellijIdea])
                it.channels.set([ProductRelease.Channel.RELEASE])
            }
        }
    }
}

// This task resolves runtimeClasspath without telling Gradle it depends on it, so the dependent
// jars would not be built first. Make the dependency explicit.
//
// The task's own `pluginName`, not a name of our own: a local variable of that name here would
// silently shadow the task property and drop the formatter into a directory the IDE never looks
// in, which is exactly what happened. The configuration is captured outside the closure so the
// configuration cache does not have to serialise the project.
def formatterFiles = configurations.formatter

tasks.withType(org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask).configureEach {
    dependsOn configurations.runtimeClasspath

    // Also pack the formatter in its own directory
    into(pluginName.map { "${it}/impl" }) {
        // Note that we don't filter down the jars in the impl directory due to behavior when
        // the formatter is bootstrapped with jdk16+ exports.
        from formatterFiles
    }
}

// Javadoc fails if there are no public classes to javadoc, so make it stop complaining.
tasks.named("javadoc", Javadoc) {
    failOnError = false
}

// Prevent duplicate class entries in the instrumented jar, which the JetBrains marketplace rejects.
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
