apply plugin: 'application'
apply plugin: 'open-java-format.publishing-conventions'

application.mainClass = 'com.palantir.javaformat.java.Main'

description = 'A modern, lambda-friendly, 120-character Java formatter'

dependencies {
    api project(':open-java-format-spi')
    api libs.guava
    implementation libs.functionaljava
    implementation libs.jackson.core
    implementation libs.jackson.databind
    implementation libs.jackson.datatype.jdk8
    implementation libs.jackson.module.parameterNames

    testImplementation libs.guava.testlib
    testImplementation libs.compileTesting
    testImplementation libs.assertj
    testImplementation libs.junit.jupiter.migrationsupport
    testImplementation libs.junit.jupiter

    compileOnly libs.autoService
    annotationProcessor libs.autoService
    compileOnly variantOf(libs.immutables.value) { classifier('annotations') }
    annotationProcessor libs.immutables.value

    compileOnly libs.derive4j.annotation
    annotationProcessor libs.derive4j
    implementation libs.jsr305
}

// Was baseline's `moduleJvmArgs`, dropped because it looks its extension up at execution
// time and the configuration cache forbids that. All it produced was this manifest attribute,
// which lets a JVM launching the jar reach the javac internals the formatter parses with.
tasks.named('jar', Jar) {
    manifest {
        attributes('Add-Exports': [
                'jdk.compiler/com.sun.tools.javac.file',
                'jdk.compiler/com.sun.tools.javac.main',
                'jdk.compiler/com.sun.tools.javac.parser',
                'jdk.compiler/com.sun.tools.javac.tree',
                'jdk.compiler/com.sun.tools.javac.util',
                'jdk.compiler/com.sun.tools.javac.code',
                'jdk.compiler/com.sun.tools.javac.api',
        ].join(' '))
    }
}

// One jar to download and run as `java -jar open-java-format-<version>-all.jar`, on Java 21 or later: the classes
// of every runtime dependency unpacked into it, the manifest of the jar above — Add-Exports included, so no JVM
// flags are needed — plus a Main-Class. The draft GitHub release carries it; Maven Central does not.
tasks.register('allJar', Jar) {
    description = 'Assembles a runnable jar with every runtime dependency inside.'
    group = 'build'
    archiveClassifier = 'all'
    manifest {
        from tasks.named('jar', Jar).get().manifest
        attributes('Main-Class': application.mainClass.get())
    }
    from sourceSets.main.output
    from(configurations.runtimeClasspath.elements.map { elements -> elements.collect { zipTree(it.asFile) } })
    // The dependencies' signatures would no longer match, and module descriptors mean nothing on the class path.
    // What stays duplicated is licence and service files; the formatter registers its Jackson modules itself, so
    // keeping the first copy is harmless.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// false positives due to org.junit.runners.* in the test cases
tasks.named("checkJUnitDependencies") {
    enabled = false
}

tasks.named("test") {
    // Run all classes and tests in parallel
    // https://junit.org/junit5/docs/current/user-guide/#writing-tests-parallel-execution
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
}

javaVersion {
    target = 21
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
