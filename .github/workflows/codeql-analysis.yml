name: "CodeQL"

on:
  push:
    branches: [ '*.X.X' ]
  pull_request:
    branches: [ '*.X.X' ]
  schedule:
    - cron: '33 9 * * 6'

jobs:
  analyze:
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No problem matcher: the javac warnings are annotated by CI's `build` job.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          problem-matcher: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build all source sets for CodeQL
        # --no-build-cache forces javac to run even if outputs are cached,
        # so CodeQL can intercept all compilation calls.
        run: ./gradlew --no-build-cache clean compileJava compileTestJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{matrix.language}}"
