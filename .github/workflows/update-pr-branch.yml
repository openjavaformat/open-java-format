name: Update PR branches

on:
  push:
    branches: [ 'main' ]
  schedule:
    # Run every hour to catch stuck PRs
    - cron: '0 * * * *'

# The action reads and updates the pull requests with BOT_PAT alone, so the workflow's own token needs
# no permissions.
permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: adRise/update-pr-branch@e96e796f4ab23ab388016fdaed7092de99bd71cf # v0.11.1
        with:
          token: ${{ secrets.BOT_PAT }}
          base: 'main'
          required_approval_count: 1
          require_passed_checks: true
