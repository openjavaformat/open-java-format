version: 2
# A release is proposed only once it is a week old: a compromised or broken release is usually pulled
# within days. The cooldown holds back version updates only; security updates still come at once.
#
# No target-branch: the pull requests go to the default branch, which is the current release line,
# 21.X.X today.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
