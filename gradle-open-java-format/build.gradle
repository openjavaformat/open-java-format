// For the Gradle Plugin Portal: publishPlugins, run by hand once the version's jars are published on Maven
// Central — the plugin depends on them. It applies java-gradle-plugin and maven-publish itself.
apply plugin: 'com.gradle.plugin-publish'
apply plugin: 'groovy'
apply plugin: 'open-java-format.publishing-conventions'

description = 'Gradle plugins for open-java-format: formatting tasks, the Spotless step and IntelliJ configuration'

configurations {
    pluginClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly libs.spotless.gradlePlugin

    implementation gradleApi()
    implementation libs.guava
    implementation project(':open-java-format-spi')
    implementation project(':open-java-format-jdk-bootstrap')
    implementation libs.palantir.platform
    implementation libs.ideaConfiguration.gradlePlugin

    testImplementation project(':open-java-format')
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj
    testImplementation libs.jackson.dataformat.xml
    // @Language on the XML fixtures; used to arrive transitively via gradle-plugin-testing.
    testImplementation libs.jetbrainsAnnotations

    testRuntimeOnly libs.junit.vintage.engine

    // Plain Gradle TestKit drives the generated projects; see
    // src/test/java/com/palantir/javaformat/gradle/testing/GradleTestProject.java.
    testImplementation gradleTestKit()

    // Third-party plugins the generated test projects apply. java-gradle-plugin injects this
    // alongside the plugin under test, so `plugins { id '...' }` resolves them without a version.
    pluginClasspath libs.spotless.gradlePlugin
    pluginClasspath libs.baseline.gradlePlugin
}

gradlePlugin {
    website = 'https://github.com/openjavaformat/open-java-format'
    vcsUrl = 'https://github.com/openjavaformat/open-java-format'
    plugins {
        openJavaFormat {
            id = 'dev.openjavaformat.java-format'
            implementationClass = 'com.palantir.javaformat.gradle.PalantirJavaFormatPlugin'
            description = 'A modern, lambda-friendly, 120 character Java formatter. Applies all other open-java-format plugins.'
            displayName = 'Open Java Format'
            tags.set(['java', 'style'])
        }
        openJavaFormatIdea {
            id = 'dev.openjavaformat.java-format-idea'
            implementationClass = 'com.palantir.javaformat.gradle.PalantirJavaFormatIdeaPlugin'
            description = 'Plugin to configure the open-java-format IDEA plugin based on an optional implementation version of the formatter.'
            displayName = 'Open Java Format Idea'
            tags.set(['java', 'style'])
        }
        openJavaFormatSpotless {
            id = 'dev.openjavaformat.java-format-spotless'
            implementationClass = 'com.palantir.javaformat.gradle.PalantirJavaFormatSpotlessPlugin'
            description = 'If spotless is applied, configures a java step that formats using open-java-format.'
            displayName = 'Open Java Format Spotless'
            tags.set(['java', 'style'])
        }
        openJavaFormatProvider {
            id = 'dev.openjavaformat.java-format-provider'
            implementationClass = 'com.palantir.javaformat.gradle.PalantirJavaFormatProviderPlugin'
            description = 'Exposes a configuration containing the open-java-format jars'
            displayName = 'Open Java Format Provider'
            tags.set(['java', 'style'])
        }
    }
}

tasks.withType(PluginUnderTestMetadata).configureEach {
    // `from(...)`, not `from += ...`: the latter reads the collection and reassigns it, dropping the
    // task dependency on `jar` that java-gradle-plugin put there. It only shows up on a clean build,
    // where the jar has not been produced yet.
    pluginClasspath.from(configurations.pluginClasspath)
}

configurations {
    impl {
        canBeConsumed = false
        canBeResolved = true
    }

    formatterNativeImage {
        canBeConsumed = false
        canBeResolved = true
    }


}

dependencies {
    impl project(':open-java-format')
    formatterNativeImage(project(':open-java-format-native')) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, project.objects.named(LibraryElements, 'nativeImage'))
        }
    }
}

tasks.register("copyNativeImage", Copy.class) {
    from(configurations.formatterNativeImage)
    // Named like the published artifact, whose extension is its artifact type: bin, and exe on Windows.
    // The plugin's ExecutableTransform starts from that type, so a Windows binary must keep .exe.
    rename { fileName ->
        fileName.endsWith('.exe') ? fileName : String.format("%s.bin", fileName)
    }
    into("$buildDir/nativeImage")
}

// Split in two so the jar build does not need a GraalVM image: every test reads
// impl.classpath, only the four that drive the binary read nativeImage.path.
//
// Everything the doLast bodies touch is captured here, at configuration time: reaching for
// `configurations` or `tasks` from inside them would pull the whole script into the task and
// the configuration cache rejects that.
def implFiles = configurations.impl
def implClasspathFile = layout.buildDirectory.file("impl.classpath")
def nativeImageDir = layout.buildDirectory.dir("nativeImage")
def nativeImagePathFile = layout.buildDirectory.file("nativeImage.path")

def writeImplClasspath = tasks.register("writeImplClasspath") {
    inputs.files(implFiles)
    outputs.file(implClasspathFile)
    doLast {
        implClasspathFile.get().asFile.text = implFiles.asPath
    }
}

def writeNativeImagePath = tasks.register("writeNativeImagePath") {
    inputs.files(tasks.named("copyNativeImage"))
    outputs.file(nativeImagePathFile)
    doLast {
        nativeImagePathFile.get().asFile.text = nativeImageDir.get().asFile.listFiles()[0].absolutePath
    }
}

tasks.named("test").configure {
    dependsOn(writeImplClasspath)

    if (rootProject.ext.nativeImageRequested) {
        dependsOn(writeNativeImagePath)
    } else {
        // These run the GraalVM binary through NativeImageFormatterService. Without
        // -PnativeImage=true there is no binary to run, so they are left to the per-platform
        // `native` CI jobs, which pass it. Keep this list in sync with the test classes that
        // read build/nativeImage.path.
        exclude '**/PalantirJavaFormatPluginTest.class'
        exclude '**/PalantirJavaFormatIdeaPluginTest.class'
        exclude '**/PalantirJavaFormatSpotlessPluginTest.class'
        exclude '**/FormatDiffTest.class'
    }
}

// The Portal never takes a version back, so only a release version goes up — X.Y.Z or X.Y.Z.N, as for Maven
// Central in open-java-format.release-conventions. --validate-only checks the metadata of any version.
def portalVersion = provider { project.version.toString() }
tasks.named('publishPlugins') {
    doFirst {
        if (!validateOnly.getOrElse(false) && !(portalVersion.get() ==~ /\d+\.\d+\.\d+(\.\d+)?/)) {
            throw new GradleException("Refusing to publish ${portalVersion.get()} to the Gradle Plugin Portal: check "
                    + 'out a release tag on a clean working tree, or pass --validate-only.')
        }
    }
}
